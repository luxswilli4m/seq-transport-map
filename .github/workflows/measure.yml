name: Measure travel times

# Records how long services actually take in the morning and afternoon windows (Brisbane time AM 6:30-9:30,
# PM 3:30-6:30), every day of the year, then rebuilds the measured travel times and publishes the site.
# Each run starts a little early and waits for its window. GitHub's timetable can be late or skip runs, so each
# run also starts "Wait for the next recording window" (wait.yml), which starts the next one itself.
#   AM: 19:43 UTC = 5:43 am in Brisbane      PM: 04:43 UTC = 2:43 pm in Brisbane
# Storage (GitHub releases in this repository, not the git history):
#   measured-raw   every recording (peak-YYYY-MM-DD-am.csv.gz), kept for 12 months then deleted, oldest first
#   measured-data  measured.tar.gz, the built data/measured folder (days, months, all time, live, last 4 weeks)
on:
  schedule:
    - cron: "43 19 * * *"
    - cron: "43 4 * * *"
  workflow_dispatch:
    inputs:
      band:
        description: "Window to record (am or pm), or 'rebuild' to only rebuild from saved recordings"
        type: choice
        options: [am, pm, rebuild]
        default: rebuild

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write
  issues: write

concurrency:
  group: measure
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      skip: ${{ steps.done.outputs.skip }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install requests gtfs-realtime-bindings holidays

      - name: Which window
        id: band
        run: |
          # a timed run takes its window from the timetable entry that started it, not the clock: GitHub sometimes
          # starts timed runs hours late, and a late morning run must not turn into an afternoon one
          if [ -n "${{ inputs.band }}" ]; then b="${{ inputs.band }}";
          elif [ "${{ github.event.schedule }}" = "43 19 * * *" ]; then b=am;
          elif [ "${{ github.event.schedule }}" = "43 4 * * *" ]; then b=pm;
          elif [ "$(date -u +%H)" -ge 12 ]; then b=am; else b=pm; fi
          echo "band=$b" >> "$GITHUB_OUTPUT"
          echo "day=$(TZ=Australia/Brisbane date -d '+30 min' +%F)" >> "$GITHUB_OUTPUT"

      - name: Storage releases
        run: |
          gh release view measured-raw -R "$REPO" >/dev/null 2>&1 || gh release create measured-raw -R "$REPO" --prerelease --title "Measured travel times: recordings" --notes "Raw recordings of the AM and PM windows, written by the Measure travel times workflow. Kept for 12 months."
          gh release view measured-data -R "$REPO" >/dev/null 2>&1 || gh release create measured-data -R "$REPO" --prerelease --title "Measured travel times: built figures" --notes "data/measured for the website, rebuilt after every window and published by the Publish the site workflow."

      # started twice (GitHub's late timetable and the waiter)? the second one finds the recording already saved
      # and stops here: nothing is rebuilt or republished
      - name: Already recorded?
        id: done
        run: |
          skip=no
          if [ "${{ steps.band.outputs.band }}" != rebuild ]; then
            have=$(gh release view measured-raw -R "$REPO" --json assets --jq '.assets[].name')
            if grep -qxF "peak-${{ steps.band.outputs.day }}-${{ steps.band.outputs.band }}.csv.gz" <<< "$have"; then skip=yes; echo "already recorded, nothing to do"; fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: Record the window
        if: steps.band.outputs.band != 'rebuild' && steps.done.outputs.skip != 'yes'
        run: |
          mkdir -p raw
          f=raw/peak-${{ steps.band.outputs.day }}-${{ steps.band.outputs.band }}.csv.gz
          python tools/collect_measured.py . --band ${{ steps.band.outputs.band }} --out "$f"
          if [ -e "$f" ]; then gh release upload measured-raw "$f" --clobber -R "$REPO"; fi

      - name: Move recordings kept as workflow artifacts (from before November 2026's switch) into the release
        if: steps.done.outputs.skip != 'yes'
        run: |
          have=$(gh release view measured-raw -R "$REPO" --json assets --jq '.assets[].name')
          gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.name | startswith("peak-")) | select(.expired | not) | [.id, .name] | @tsv' |
          while IFS=$'\t' read -r id name; do
            if echo "$have" | grep -qx "$name.csv.gz"; then continue; fi
            mkdir -p "old/$name"
            if gh api "repos/$REPO/actions/artifacts/$id/zip" > "old/$name.zip" && unzip -q -o "old/$name.zip" -d "old/$name"; then
              for f in old/$name/*.csv.gz; do gh release upload measured-raw "$f" --clobber -R "$REPO"; done
            fi
          done
          rm -rf old

      - name: Fetch recordings from the last 40 days, and the previous build
        if: steps.done.outputs.skip != 'yes'
        run: |
          mkdir -p raw state
          since=$(TZ=Australia/Brisbane date -d '-40 days' +%F)
          gh release view measured-raw -R "$REPO" --json assets --jq '.assets[].name' |
          while read -r name; do
            d=$(echo "$name" | sed -n 's/^peak-\([0-9-]\{10\}\)-.*/\1/p')
            if [ -n "$d" ] && [ ! "$d" \< "$since" ] && [ ! -e "raw/$name" ]; then gh release download measured-raw -p "$name" -D raw -R "$REPO"; fi
          done
          ls raw | wc -l
          if gh release download measured-data -p measured.tar.gz -D /tmp -R "$REPO"; then tar -xzf /tmp/measured.tar.gz -C state; fi

      - name: Rebuild measured travel times
        if: steps.done.outputs.skip != 'yes'
        run: python tools/build_measured.py raw state .

      - name: Save the build
        if: steps.done.outputs.skip != 'yes'
        run: |
          tar -czf measured.tar.gz -C data/measured .
          ls -la measured.tar.gz
          gh release upload measured-data measured.tar.gz --clobber -R "$REPO"

      - name: Delete recordings older than 12 months
        if: steps.done.outputs.skip != 'yes'
        run: |
          cut=$(TZ=Australia/Brisbane date -d '-366 days' +%F)
          gh release view measured-raw -R "$REPO" --json assets --jq '.assets[].name' |
          while read -r name; do
            d=$(echo "$name" | sed -n 's/^peak-\([0-9-]\{10\}\)-.*/\1/p')
            if [ -n "$d" ] && [ "$d" \< "$cut" ]; then gh release delete-asset measured-raw "$name" -y -R "$REPO"; fi
          done

  publish:
    needs: measure
    if: needs.measure.outputs.skip != 'yes'
    uses: ./.github/workflows/pages.yml

  # start the waiter for the next window (a backup in case GitHub's timetable is late or skips a run)
  next:
    needs: measure
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/actions/workflows/wait.yml/dispatches" -f ref=main

  # missed-window alert: if a window in the last 3 days has no recording, open a GitHub issue (which emails the owner)
  check:
    needs: measure
    if: always()
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Look for missed windows
        run: |
          start=$(date -d "2026-11-20 12:00 +1000" +%s)   # the backups began here; earlier gaps are known
          now=$(date +%s)
          have=$(gh release view measured-raw --json assets --jq '.assets[].name')
          for d in 0 1 2 3; do
            day=$(TZ=Australia/Brisbane date -d "-$d day" +%F)
            for w in "am 09:45 AM (6:30-9:30 am)" "pm 18:45 PM (3:30-6:30 pm)"; do
              set -- $w; band=$1; due=$(date -d "$day $2 +1000" +%s); shift 2; label="$*"
              if [ $due -gt $now ] || [ $due -lt $start ]; then continue; fi
              if grep -qxF "peak-$day-$band.csv.gz" <<< "$have"; then continue; fi
              title="Travel-time recording missed: $(TZ=Australia/Brisbane date -d "$day" '+%a %-d %b %Y') $band"
              if [ -n "$(gh issue list --state all --search "\"$title\" in:title" --json number --jq '.[].number')" ]; then continue; fi
              printf '%s\n' "The $label window on $day wasn't recorded, so it's missing from the measured travel times." "" \
                "The recording is started by GitHub's timer, by the waiter workflow after each recording, and by the Cloudflare worker's 6:00/6:20 am and 3:00/3:20 pm checks. If all three missed it, check the recent runs: https://github.com/$GH_REPO/actions" "" \
                "If the Cloudflare checks keep failing, the worker's GITHUB_TOKEN secret may have been removed or revoked." "" \
                "Nothing needs fixing for the past window (the live feed has no history); later windows record as normal. Close this issue once read." > body.txt
              gh issue create --title "$title" --body-file body.txt
              echo "opened: $title"
            done
          done
