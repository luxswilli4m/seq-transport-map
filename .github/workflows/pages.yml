name: Publish the site

# Publishes GitHub Pages from the repository plus the measured travel times, which live in the "measured-data"
# release instead of the repository (so twice-daily updates don't pile up in git history).
# Runs on every push to main, on demand, and at the end of the measuring and weekly refresh workflows.
# Needs Settings > Pages > Source set to "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Add measured travel times
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf data/measured && mkdir -p data/measured
          if gh release download measured-data -p measured.tar.gz -D /tmp -R "${{ github.repository }}"; then
            tar -xzf /tmp/measured.tar.gz -C data/measured
          else
            echo "No measured travel times saved yet."
          fi
          du -sh data/measured

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      # GitHub sometimes can't find the just-uploaded site for a moment ("No artifacts named github-pages were
      # found"), so a failed deploy waits a minute and tries again before the run counts as failed
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait a minute before trying again
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
