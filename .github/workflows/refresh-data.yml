name: Refresh Translink data

# Every Monday at 3:17 am Brisbane time (Sunday 17:17 UTC), and on demand from the Actions tab.
on:
  schedule:
    - cron: "17 17 * * 0"
  workflow_dispatch:
    inputs:
      force_zones:
        description: "Accept bus zone / busway changes even if the safety check held them back"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install pandas shapely scipy pillow contourpy pmtiles mapbox-vector-tile opencv-python-headless

      - name: Download Translink SEQ GTFS
        run: |
          curl -fsSL --retry 3 -o gtfs.zip https://gtfsrt.api.translink.com.au/GTFS/SEQ_GTFS.zip
          unzip -q gtfs.zip -d gtfs

      - name: Rebuild routes, stops and timetables
        run: |
          python tools/build_network.py gtfs .
          python tools/build_timetables.py gtfs .
          python tools/build_planner.py gtfs .

      - name: Rebuild bus zones and busways (with safety check)
        run: |
          python tools/build_zones.py gtfs . ${{ inputs.force_zones && '--force' || '' }}

      - name: Rebuild school routes list
        continue-on-error: true
        run: |
          curl -fsSL --retry 3 -o school.zip https://gtfsrt.api.translink.com.au/GTFS/SEQ_SCH_GTFS.zip
          unzip -q school.zip -d school
          python tools/build_school.py school gtfs .

      - name: Rebuild BAU platform areas
        continue-on-error: true
        run: python tools/build_platforms.py gtfs .

      - name: Re-trace on-demand areas whose Translink map picture changed
        continue-on-error: true
        run: python tools/trace_ondemand.py .

      - name: Rebuild on-demand service areas
        continue-on-error: true
        run: python tools/build_ondemand.py gtfs .

      - name: go card vendors (Translink retailer feed; keeps last file if the feed fails)
        continue-on-error: true
        run: python tools/build_retailers.py

      - name: Notify if parts of the map were held back
        if: hashFiles('zone_check.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Map refresh $(date +%d-%m-%Y): some map changes held back" --body-file zone_check.txt
          rm zone_check.txt

      - name: Commit if anything changed
        run: |
          rm -rf gtfs gtfs.zip school school.zip
          if git diff --quiet -- data; then
            echo "No changes in Translink data."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            python tools/stamp.py   # new version tag so browsers fetch the fresh data
            git add data index.html tools/ondemand_traced.json
            git commit -m "Weekly Translink data refresh"
            git push
          fi
